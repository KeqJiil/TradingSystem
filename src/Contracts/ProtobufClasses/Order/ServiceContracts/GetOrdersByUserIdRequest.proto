syntax = "proto3";

package trading.order.v1;

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Order";

import "google/protobuf/timestamp.proto";
import "ProtobufClasses/Order/ServiceContracts/Enums.proto";

message GetOrdersByUserIdRequest {
    optional OrderStatus status = 1;
    int32 limit = 2;
    optional google.protobuf.Timestamp after_created_at = 3;
    optional string after_id = 4;
}