syntax = "proto3";

package trading.order.v1;

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Order";

import "google/protobuf/timestamp.proto";
import "ProtobufClasses/Order/ServiceContracts/Enums.proto";

message OrderDto {
  string id = 1;
  Symbol symbol = 2;
  OrderSide side = 3;
  OrderType type = 4;
  optional string limit_price = 5;
  int32 quantity = 6;
  int32 filled_quantity = 7;
  OrderStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
}

message OrderFillDto {
  string execution_id = 1;
  int32 quantity = 2;
  string price = 3;
  google.protobuf.Timestamp filled_at = 4;
}
