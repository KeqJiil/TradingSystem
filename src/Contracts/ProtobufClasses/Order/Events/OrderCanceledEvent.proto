syntax = "proto3";

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Order";

import "google/protobuf/timestamp.proto";

message OrderCanceledEvent {
    string AggregateId = 1;
    string Reason = 2;
    int32 FilledQuantity = 3;
    int32 CanceledQuantity = 4;
    google.protobuf.Timestamp OccurredAt = 5;
}
