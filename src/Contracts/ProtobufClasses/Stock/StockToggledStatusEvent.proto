syntax = "proto3";

package trading.stock.v1;

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Stock";

import "google/protobuf/timestamp.proto";

message StockToggledStatusEvent {
    string AggregateId = 1;
    google.protobuf.Timestamp ToggledAt = 4;
    bool IsOpenToTrade = 2;
    int64 StatusVersion = 3;
}