syntax = "proto3";

package trading.stock.v1;

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Stock";

import "google/protobuf/timestamp.proto";

message PriceChangeRequestedEvent {
    string EventId = 1;
    string AggregateId = 2;
    string PriceChange = 3;
    google.protobuf.Timestamp OccurredAt = 4;
}