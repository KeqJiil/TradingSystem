syntax = "proto3";

package trading.stock.v1;

option csharp_namespace = "TradingSystem.Contracts.ProtobufClasses.Stock";

import "google/protobuf/duration.proto";

message TimeChangedEvent {
    string AggregateId = 1;
    google.protobuf.Duration TradingStartTime = 2;
    google.protobuf.Duration TradingCloseTime = 3;
    int64 Version = 4;
}