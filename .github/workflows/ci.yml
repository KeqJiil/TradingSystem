name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore TradingSystem.slnx

      - run: dotnet build TradingSystem.slnx --no-restore -c Release

      - run: dotnet test TradingSystem.slnx --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: TestResults
